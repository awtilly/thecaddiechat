name: Publish or Discard Draft

# Triggered by the Firebase Cloud Function (publishDraft) via workflow_dispatch.
# Requires PUBLISH_PAT repo secret — see functions/README.md for setup.

on:
  workflow_dispatch:
    inputs:
      action:
        description: '"publish" or "discard"'
        required: true
        type: string
      slug:
        description: 'Chronicle slug (MDX filename without .mdx extension)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Use PUBLISH_PAT so the subsequent push triggers deploy.yml.
          # (Pushes via the default GITHUB_TOKEN do NOT re-trigger other workflows.)
          token: ${{ secrets.PUBLISH_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate inputs
        run: |
          if [[ ! "${{ inputs.slug }}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid slug: ${{ inputs.slug }}"
            exit 1
          fi
          if [[ "${{ inputs.action }}" != "publish" && "${{ inputs.action }}" != "discard" ]]; then
            echo "::error::Invalid action: ${{ inputs.action }}"
            exit 1
          fi
          FILE="src/content/chronicles/${{ inputs.slug }}.mdx"
          if [ ! -f "$FILE" ]; then
            echo "::error::File not found: $FILE"
            exit 1
          fi

      - name: Publish draft (flip draft flag to false)
        if: inputs.action == 'publish'
        run: |
          FILE="src/content/chronicles/${{ inputs.slug }}.mdx"
          sed -i 's/^draft: true$/draft: false/' "$FILE"
          git add "$FILE"
          git commit -m "publish(chronicles): ${{ inputs.slug }}"
          git push

      - name: Discard draft (delete file)
        if: inputs.action == 'discard'
        run: |
          FILE="src/content/chronicles/${{ inputs.slug }}.mdx"
          git rm "$FILE"
          git commit -m "discard(chronicles): ${{ inputs.slug }}"
          git push
